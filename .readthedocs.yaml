# Read the Docs build configuration for the Neuro Note static web app.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      - mkdir -p $READTHEDOCS_OUTPUT/html
      - |
          if [ -f index.html ]; then
            cp -r . $READTHEDOCS_OUTPUT/html/
          else
            cp -r outputs/neuro-exam/. $READTHEDOCS_OUTPUT/html/
          fi
