<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b4f6c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Neuro Note" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="sensory-map.css" />
    <title>Neuro Note</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>NeuroExam</h1>
        <button id="clear-button" class="text-button" type="button">Clear all</button>
      </header>

      <section id="exam-page" class="app-page" aria-label="Examination">
      <section class="patient-card" aria-label="Patient details">
        <label>Patient / identifier<input id="patient" placeholder="Optional" autocomplete="off" /></label>
        <label>Date<input id="exam-date" type="date" /></label>
      </section>
      <p class="privacy-note">Nothing you type is saved or sent anywhere — it stays in this tab only, and is lost if you reload or close it. Copy your note before leaving.</p>

      <div class="exam-workspace">
        <div id="template-options" class="template-options"></div>
        <input id="exam-template-state" type="hidden" data-key="exam-template" />
        <input id="exam-mode-state" type="hidden" data-key="exam-mode" />

        <div class="exam-toolbar">
          <button id="mark-all-normal-button" class="mark-all-normal-button" type="button">Mark entire exam normal</button>
        </div>

        <section id="quick-screen" class="quick-screen" aria-label="Quick neurological screen" hidden></section>
        <section id="pathway-screen" class="pathway-screen" aria-label="Focused neurological assessment" hidden></section>
        <aside class="exam-sidebar" aria-label="Examination navigation">
          <p class="eyebrow">EXAMINATION</p>
          <nav id="section-nav" class="section-nav" aria-label="Exam sections"></nav>
          <p id="progress" class="progress" aria-live="polite"></p>
        </aside>

        <div class="exam-content">
          <div id="exam-sections"></div>

          <section id="note-panel" class="note-panel" aria-labelledby="note-title" hidden>
            <div class="note-heading">
              <div>
                <p class="eyebrow">GENERATED NOTE</p>
                <h2 id="note-title">Neurology note</h2>
              </div>
              <div class="note-heading-actions">
                <div class="note-style-toggle" role="group" aria-label="Note style">
                  <button type="button" class="active" data-note-style="bullets">Bullets</button>
                  <button type="button" data-note-style="prose">Prose</button>
                </div>
                <button id="copy-button" class="secondary-button" type="button">Copy note</button>
              </div>
            </div>
            <textarea id="note-output" aria-label="Generated examination note" spellcheck="true"></textarea>
            <p class="helper">This is a documentation aid. Review and edit the note before it is added to a clinical record.</p>
          </section>
        </div>
      </div>
      </section>

      <div class="note-actions-bar">
        <button id="generate-button" class="generate-button" type="button">Generate note</button>
      </div>

    </main>
    <script src="app.js"></script>
  </body>
</html>
